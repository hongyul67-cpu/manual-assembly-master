<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기계수동조립</title>
<!-- 수업용 「모두 같은 문제」 — 다른 공용 스크립트보다 먼저 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px 14px 110px}

  header{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}
  .warnbox{background:#fff8e6;border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
           padding:8px 12px;margin-top:10px;font-size:14px}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.5}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
          border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .choice:hover{border-color:var(--pri)}
  .choice.correct{border-color:var(--ok);background:#eafaf1}
  .choice.wrong{border-color:var(--no);background:#fdeeee}
  .choice.picked{border-width:2px}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:10px 14px;margin-top:10px;color:#334}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}
  .combo{display:inline-block;background:#fff3d6;color:#a15c00;border-radius:99px;
         padding:2px 10px;font-size:12px;font-weight:800}

  /* 눈금 그림 — 좁은 화면에서는 가로로 밀어 봅니다 */
  .scaleBox{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
            border-radius:10px;background:#fff;padding:6px}
  .scaleBox canvas{display:block}
  .hintbar{font-size:13px;color:var(--dim);margin:6px 0 2px}
  .symGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:10px}
  .symCell{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 6px;text-align:center}
  .symCell svg{display:block;width:100%;height:72px}
  .symCell b{display:block;font-size:12.5px;line-height:1.35;margin-top:6px;word-break:keep-all}
  .symGrid.pick{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .symGrid.pick .symCell svg{height:96px}
  .symCell.pickable{cursor:pointer}
  .symCell.pickable:hover{border-color:var(--pri)}
  .symCell.correct{border-color:var(--ok);background:#eafaf1}
  .symCell.wrong{border-color:var(--no);background:#fdeeee}
  .symNo{position:absolute;top:6px;left:8px;font-size:12px;font-weight:700;color:var(--dim)}
  .symStage{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin:10px 0}
  .symStage svg{display:block;width:100%;max-width:230px;height:132px;margin:0 auto}

  /* 공구 고르기 */
  .toolGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  @media(min-width:620px){ .toolGrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .toolCard{border:1px solid var(--line);border-radius:12px;background:var(--card);
            padding:8px 6px 6px;cursor:pointer;text-align:center}
  .toolCard:hover{border-color:var(--pri)}
  .toolCard.correct{border-color:var(--ok);background:#eafaf1}
  .toolCard.wrong{border-color:var(--no);background:#fdeeee}
  .toolCard svg{width:100%;height:56px;display:block}
  .toolCard b{font-size:13px;display:block;margin-top:4px;font-weight:700}

  /* 순서 배열 */
  .stepPool{display:flex;flex-direction:column;gap:8px}
  .step{border:1px solid var(--line);border-radius:10px;background:var(--card);
        padding:11px 13px;cursor:pointer;font-size:15px;text-align:left}
  .step:hover{border-color:var(--pri)}
  .step.done{background:#eef4ff;border-color:var(--pri);color:var(--dim);cursor:default}
  .step.bad{border-color:var(--no);background:#fdeeee}
  .slotList{counter-reset:s;margin:0 0 12px;padding:0;list-style:none}
  .slotList li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
  .slotNo{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;
          font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
  .num{display:inline-block;min-width:22px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>기계수동조립</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="gauge">📏 눈금 읽기</button>
    <button class="tab"    data-view="tool">🔧 공구 고르기</button>
    <button class="tab"    data-view="order">🧩 조립 순서</button>
    <button class="tab"    data-view="sym">🔣 기호 고르기</button>
    <button class="tab"    data-view="practice">✏️ 연습 8문항</button>
    <button class="tab"    data-view="exam">🏁 종합시험 20문항</button>
    <button class="tab"    data-view="wrong">📕 오답노트</button>
  </div>

  <div id="view"></div>
</div>

<script>

  '① 먼저 <span class="kw">손으로</span> 끝까지 돌려 넣어 나사산이 제대로 물렸는지 확인한다.<br>' +
  '② <span class="kw">대각선 순서</span>로 돌아가며 가볍게 조인다.<br>' +
  '③ 같은 순서로 <span class="kw">2~3회에 나누어</span> 조금씩 조인다.<br>' +
  '④ 마지막에 <span class="kw">토크 렌치</span>로 규정 토크를 확인한다.' +
  '<div class="warnbox">선반 바이트 고정 볼트도 같은 원칙입니다 — 반드시 2개 이상으로 평균되게 조이며, ' +
  '조임을 2~3회로 나누어 볼트를 조금씩 조입니다.</div>' },

/* ═══ 3단원 · 측정기와 눈금 읽기 ═══ */
{ unit:'3단원 측정기', t:'버니어 캘리퍼스 — 어떻게 읽는가', body:
  '버니어 캘리퍼스는 <b>본척(어미자)</b>과 <b>아들자(버니어)</b> 두 개의 눈금으로 읽습니다. ' +
  '1/20(0.05mm) 캘리퍼스는 아들자 <span class="kw">19mm 를 20등분</span>했기 때문에, ' +
  '아들자 한 눈금은 본척 한 눈금보다 <span class="kw">0.05mm 씩 짧습니다</span>.<br><br>' +
  '① <b>아들자의 0</b> 이 지나온 본척 눈금을 읽어 <span class="kw">mm 자리</span>를 얻습니다.<br>' +
  '② 아들자 눈금 중 본척 눈금과 <span class="kw">일직선으로 딱 맞는</span> 것을 찾습니다.<br>' +
  '③ 그 눈금의 번호 × 0.05mm 를 ① 에 더합니다.<br>' +
  '<div class="warnbox">아래 그림은 <b>읽는 법을 보여 주는 예시</b>입니다. 아들자 0 이 본척 <b>12</b> 를 막 지났고, ' +
  '딱 맞는 아들자 눈금이 <b>7</b> 번째이므로 12 + 7×0.05 = <b>12.35mm</b> 입니다.</div>',
  draw: function(c){
    var box = document.createElement('div'); box.className = 'scaleBox'; box.style.marginTop = '10px';
    var cv = document.createElement('canvas'); box.appendChild(cv); c.appendChild(box);
    drawCaliper(cv, 12.35, true);
  } },

{ unit:'3단원 측정기', t:'마이크로미터 — 어떻게 읽는가', body:
  '마이크로미터는 <b>슬리브</b>(고정된 가로 눈금)와 <b>딤블</b>(돌아가는 세로 눈금)로 읽습니다. ' +
  '보통 사용되는 마이크로미터는 <span class="kw">나사의 피치가 0.5mm</span> 이므로, 딤블이 한 바퀴 돌면 스핀들이 0.5mm 나아갑니다. ' +
  '딤블은 50등분되어 있으므로 한 눈금이 <span class="kw">0.01mm</span> 입니다.<br><br>' +
  '① 딤블 끝이 드러낸 슬리브 눈금을 읽습니다. 위쪽 줄은 <span class="kw">1mm</span> 자리, 아래쪽 줄은 <span class="kw">0.5mm</span> 자리입니다.<br>' +
  '② 슬리브의 <span class="kw">기준선</span>과 나란히 맞은 딤블 눈금을 읽어 0.01mm 자리를 얻습니다.<br>' +
  '③ 둘을 더합니다.' +
  '<div class="warnbox">아래 그림은 <b>읽는 법을 보여 주는 예시</b>입니다. 슬리브가 <b>7.5</b> 까지 드러났고 ' +
  '기준선에 맞은 딤블 눈금이 <b>12</b> 이므로 7.5 + 0.12 = <b>7.62mm</b> 입니다.</div>',
  draw: function(c){
    var box = document.createElement('div'); box.className = 'scaleBox'; box.style.marginTop = '10px';
    var cv = document.createElement('canvas'); box.appendChild(cv); c.appendChild(box);
    drawMic(cv, 7.62, true);
  } },

{ unit:'3단원 측정기', t:'마이크로미터의 종류와 측정 범위', body:
  '마이크로미터의 스핀들 측정 범위는 0~25mm, 25~50mm 처럼 <span class="kw">25mm 간격</span>으로 되어 있습니다. ' +
  '최대 3m 까지 측정할 수 있는 것도 있습니다.<br><br>' +
  '종류에는 <span class="kw">외측 마이크로미터</span>, <span class="kw">내측 마이크로미터</span>, ' +
  '<span class="kw">깊이 마이크로미터</span>, <span class="kw">나사 마이크로미터</span> 등이 있습니다.<br><br>' +
  '나사 마이크로미터에는 엔빌 일체형과 엔빌 교환형이 있는데, 일체형은 정해진 피치의 나사만 측정할 수 있고, ' +
  '교환형은 다양한 피치의 엔빌을 교환해 <span class="kw">하나의 측정기로 여러 피치</span>를 측정할 수 있습니다.' },

{ unit:'3단원 측정기', t:'안지름을 재는 측정기 세 가지', body:
  '일반적으로 내경을 측정하는 데 사용되는 측정기는 다음 셋입니다.<br><br>' +
  '· <b>내측 마이크로미터</b> — 내측의 <span class="kw">2점</span>을 측정합니다. 측정기의 측정선과 측정물의 기준선을 ' +
  '일치시키기가 어려워 측정 시 오차가 발생하기 쉽습니다. 홈 폭을 측정할 수 있습니다.<br>' +
  '· <b>3점식 마이크로미터(홀 테스터)</b> — 측정자가 <span class="kw">정삼각형</span>으로 위치하므로 구멍의 중심과 ' +
  '측정기의 중심을 일치시키기 쉽고, 미숙련자도 측정에 큰 어려움이 없습니다. 구멍의 치수를 정밀하게 측정하는 데 적합하지만 ' +
  '<span class="kw">홈 폭은 측정할 수 없습니다</span>.<br>' +
  '· <b>실린더 게이지</b> — 2점 측정 방식으로, 치수 변화량을 부착된 다이얼 게이지의 지침으로 읽습니다. ' +
  '내경 및 홈 폭을 측정하는 데 편리하며 측정 범위는 15~150mm 까지가 주로 사용됩니다.' },

{ unit:'3단원 측정기', t:'측정할 때 지켜야 할 것', body:
  '· 측정은 반드시 <span class="kw">기계가 정지한 후</span>에 실시한다.<br>' +
  '· 측정 전에 각종 측정기의 <span class="kw">영점을 조정</span>한다. 외측 마이크로미터는 엔빌과 스핀들의 단면을 깨끗하게 ' +
  '닦아 접촉시켜 값을 읽고, 영점이 맞지 않으면 훅 스패너로 슬리브를 돌려 딤블의 눈금 0 과 슬리브 기준선을 일치시킨다.<br>' +
  '· 외측 마이크로미터는 <span class="kw">래칫 스톱</span>을 이용해 적정한 측정압으로 측정한다. ' +
  '래칫 스톱을 강하게 회전시켜 회전력에 의해 측정값이 달라지지 않도록 한다.<br>' +
  '· 측정기와 제품에 먼지·이물질이 묻지 않도록 주의하고, 조심히 다루고 정리 정돈한다.<br>' +
  '· 정밀한 측정을 위해서는 측정실의 온도를 약 <span class="kw">20℃</span> 에 맞추고 제품을 측정실에 1일 이상 보관한다.' },

/* ═══ 4단원 · 치수 공차와 끼워맞춤 ═══ */
{ unit:'4단원 공차와 끼워맞춤', t:'IT 기본 공차', body:
  '부품이 필요한 기능을 확보하고 경제적으로 제작되기 위해서는 적정한 공차가 필요합니다. ' +
  '치수 공차는 <span class="kw">IT 기본 공차</span>를 적용합니다.<br><br>' +
  'IT 등급은 0mm 초과 500mm 이하의 기준 치수에 대하여 IT01, IT0, IT1, IT2 … IT18 까지 ' +
  '<span class="kw">20개 등급</span>으로 구분합니다.<br>' +
  '· 기준 치수가 <span class="kw">클수록</span>, IT 등급이 <span class="kw">높을수록</span> 공차가 커집니다.<br>' +
  '· 구멍의 IT 등급은 축의 IT 등급보다 <span class="kw">한 등급 위</span>의 것을 적용합니다(축이 IT5 이면 구멍은 IT6). ' +
  '구멍이 축보다 가공하기 어렵기 때문에 더 큰 공차를 허용하는 것입니다.' +
  '<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:14px;margin-top:10px;min-width:420px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'">용도</th><th style="'+TD+'">게이지 제작</th><th style="'+TD+'">끼워맞춤</th><th style="'+TD+'">끼워맞춤 이외</th></tr>' +
  '<tr><td style="'+TD+'">구멍</td><td style="'+TD+'">IT1 ~ IT5</td><td style="'+TD+'">IT6 ~ IT10</td><td style="'+TD+'">IT11 ~ IT18</td></tr>' +
  '<tr><td style="'+TD+'">축</td><td style="'+TD+'">IT1 ~ IT4</td><td style="'+TD+'">IT5 ~ IT9</td><td style="'+TD+'">IT10 ~ IT18</td></tr>' +
  '</table></div>' },

{ unit:'4단원 공차와 끼워맞춤', t:'끼워맞춤 세 가지', body:
  '끼워맞춤은 <span class="kw">구멍과 축이 조립되는 관계</span>입니다. 끼워지는 구멍과 축의 치수 관계에 따라 셋으로 분류됩니다.<br><br>' +
  '<b>헐거운 끼워맞춤</b> — 구멍의 최소 허용 치수가 축의 최대 허용 치수와 같거나 큰 경우로, 항상 ' +
  '<span class="kw">틈새</span>가 생기는 끼워맞춤입니다. 부품이 서로 상대운동을 하거나 쉽게 조립해야 하는 곳에 적용합니다.<br><br>' +
  '<b>억지 끼워맞춤</b> — 구멍의 최대 허용 치수가 축의 최소 허용 치수보다 작은 상태로, 조립되었을 때 항상 ' +
  '<span class="kw">죔새</span>가 생기는 끼워맞춤입니다. 영구 조립하는 경우나 동력 전달을 목적으로 조립하는 경우에 적용합니다.<br><br>' +
  '<b>중간 끼워맞춤</b> — 구멍 치수가 축의 치수보다 클 수도 있고 작을 수도 있는 경우입니다. ' +
  '경우에 따라 틈새가 생기거나 죔새가 생기므로 필요한 관계를 얻기 위해 <span class="kw">선택 조립</span>을 해야 합니다. ' +
  '베어링 조립 등 정밀한 죔새나 틈새를 얻는 경우에 적용합니다.' },

{ unit:'4단원 공차와 끼워맞춤', t:'끼워맞춤 표기 읽기', body:
  '표기 순서는 <b>기준 치수 → 구멍의 종류(영문 대문자) → 구멍의 IT 공차 등급 → 축의 종류(영문 소문자) → 축의 IT 공차 등급</b> 입니다.' +
  '<div style="text-align:center;font-size:26px;font-weight:900;letter-spacing:1px;margin:14px 0 6px">50H7/g6</div>' +
  '<div style="text-align:center" class="muted">50 = 기준 치수 · H7 = 구멍(대문자 H, 7등급) · g6 = 축(소문자 g, 6등급)</div>' +
  '<div class="warnbox"><b>대문자면 구멍, 소문자면 축</b> — 이것만 기억하면 절반은 읽은 것입니다. ' +
  '50H7g6 처럼 빗금 없이 붙여 쓰기도 합니다.</div>' },

/* ═══ 5단원 · 축 · 베어링 조립 ═══ */
{ unit:'5단원 축·베어링 조립', t:'축의 종류', body:
  '축은 일반적으로 베어링에 지지되어 회전 및 왕복운동을 하는 기계요소입니다. ' +
  '축이 베어링에 의하여 지지되는 부분을 <span class="kw">저널</span>이라 합니다. ' +
  '긴 축이 필요할 때에는 축이음(커플링)으로 축을 연결하며, 운동을 단속할 필요가 있을 때는 클러치를 사용합니다.<br><br>' +
  '<b>하중에 의한 분류</b><br>' +
  '· <span class="kw">차축</span> — 주로 <b>굽힘 모멘트</b>를 받는 축. 철도 차량의 차축처럼 그 자체가 회전하는 회전축과, ' +
  '자동차 바퀴 축처럼 바퀴는 회전하지만 축은 회전하지 않는 정지축이 있습니다.<br>' +
  '· <span class="kw">스핀들</span> — 주로 <b>비틀림 모멘트</b>를 받으며 직접 일을 하는 회전축. 치수가 정밀하고 변형량이 작으며 ' +
  '길이가 짧아 선반·밀링머신 등 공작기계의 주축으로 사용합니다.<br>' +
  '· <span class="kw">전동축</span> — 회전에 의해 동력을 전달하는 축으로 주로 <b>비틀림과 굽힘 모멘트를 동시에</b> 받습니다. ' +
  '주축(원동기에서 직접 동력을 받는 축) · 선축(주축에서 받아 분배하는 축) · 중간축(선축에서 받아 각 기계에 전달하는 축)이 있습니다.<br><br>' +
  '<b>모양에 따른 분류</b> — 직선 축, 크랭크 축(직선운동과 회전운동을 상호 변환).' },

{ unit:'5단원 축·베어링 조립', t:'베어링의 종류와 구조', body:
  '베어링은 축을 받쳐 줄 뿐만 아니라 축의 회전을 원활하게 하는 기계요소로, ' +
  '<span class="kw">미끄럼 베어링</span>과 <span class="kw">구름 베어링</span>이 있습니다.<br><br>' +
  '구름 베어링은 구름 접촉을 하기 때문에 미끄럼 베어링에 비해 마찰이 작아서 마찰 손실이 적고, ' +
  '기동저항과 발열도 작아 고속회전을 할 수 있습니다. 그러나 전동체와 궤도륜이 점접촉이나 선접촉을 하기 때문에 ' +
  '<span class="kw">충격에 약하고 소음이 생기기 쉬운</span> 결점이 있습니다.<br><br>' +
  '구름 베어링은 내륜과 외륜 사이에 볼 또는 롤러 등의 <b>전동체</b>를 넣고, 전동체의 간격을 일정하게 유지하기 위하여 ' +
  '<span class="kw">리테이너</span>를 가집니다.<br><br>' +
  '· <b>원통 롤러 베어링</b> — 레디얼 부하용량이 매우 크고, <span class="kw">스러스트 하중은 전혀 받을 수 없습니다</span>. ' +
  '중하중용이며 충격에 강합니다.<br>' +
  '· <b>니들 롤러 베어링</b> — 길이에 비해 지름이 매우 작은 롤러(지름 2~5mm)를 사용하며, 좁은 장소에서 비교적 큰 하중을 받는 ' +
  '내연기관의 피스톤 핀에 사용됩니다.<br>' +
  '· <b>원뿔 롤러 베어링</b> — 레디얼 하중과 스러스트 하중을 <span class="kw">동시에</span> 받을 수 있으며, ' +
  '주로 공작기계의 주축에 쓰입니다.' },

{ unit:'5단원 축·베어링 조립', t:'베어링의 내부 클리어런스', body:
  '베어링의 클리어런스는 베어링에 <span class="kw">외력을 가하지 않은 상태</span>에서 내륜과 외륜의 상대적 변위를 말하며, ' +
  '변위 방향에 따라 <span class="kw">축 방향 클리어런스</span>와 <span class="kw">반경 방향 클리어런스</span> 두 가지가 있습니다.<br><br>' +
  '클리어런스는 끼워맞춤, 작동 시 발생하는 온도차에 의한 열 팽창량, 하중에 의한 변형, 조립 시 베어링에 가하는 조립 예압 등의 ' +
  '변화로 <b>초기 클리어런스</b>와 <b>조립 후의 클리어런스</b>로 구별되며, ' +
  '보통 <span class="kw">초기 클리어런스가 설치 후의 클리어런스보다 큽니다.</span>' },

{ unit:'5단원 축·베어링 조립', t:'키(key)와 오일 실', body:
  '· 키의 치수·재질·형상·규격 등을 고려하여 충분한 강도를 가지도록 하며, <span class="kw">규격품을 사용</span>합니다.<br>' +
  '· 키의 각 모서리는 <span class="kw">모따기</span>를 행하고, 양단은 타격에 의한 말림 방지 때문에 큰 모따기를 행합니다.<br><br>' +
  '· 오일 실은 이물질 유입을 막기 위해 밀봉 포장되어 있으므로 <span class="kw">조립작업 직전에 개봉</span>하여 ' +
  '고무의 탄성은 정상인지, 스프링 부위에 녹슬지 않았는지 등 이상 유무를 확인하고 <span class="kw">전용 공구</span>를 사용하여 조립합니다.<br>' +
  '· 커버는 6각 홈붙이 볼트로 조립되며, 규격에 맞는 L 렌치를 사용하여 <span class="kw">무리한 힘을 가하지 말고</span> 조립합니다.' },

/* ═══ 6단원 · 조립 후 점검과 안전 ═══ */
{ unit:'6단원 조립 후 점검', t:'조립한 뒤 손으로 먼저 확인하는 것', body:
  '베어링과 오일 실을 조립한 뒤에는 동력을 넣기 전에 손으로 먼저 검사합니다.<br><br>' +
  '① 축을 손으로 서서히 돌리면서 먼지나 흠집의 영향으로 회전은 부드러운지 <span class="kw">촉감으로</span> 검사한다.<br>' +
  '② 조립 불량으로 <span class="kw">회전 토크에 변화</span>가 생기는지를 검사한다.' +
  '<div class="warnbox">조립 불량의 경우 회전시키면 <b>토크의 변화</b>를 손으로 느낄 수 있습니다. ' +
  '이 단계에서 잡지 않으면 동력을 넣은 뒤에 베어링이 망가집니다.</div>' },

{ unit:'6단원 조립 후 점검', t:'동력을 넣은 뒤 확인하는 것', body:
  '벨트 풀리와 기어를 모두 조립한 후 동력을 연결하고 정상 회전 상태에서 다음을 검사합니다.<br><br>' +
  '① <b>이상음</b> — 높은 금속음, 규칙적인 소음, 불규칙적인 소음이 발생하는지 확인한다.<br>' +
  '② <b>온도 상승</b> — 윤활 불량·조립 불량 등에 의해 온도가 비정상적으로 상승하는지 확인한다. ' +
  '원인은 윤활의 영향, <span class="kw">끼워맞춤의 영향</span>, 과도한 하중의 영향 등으로 나누어 볼 수 있다.<br><br>' +
  '검사 항목은 회전 속도의 변동, 진동, 소음, 소모 전력의 변화, 토크의 변화, 윤활유의 누설 여부, 변색 등입니다.' +
  '<div class="warnbox">검사 결과는 반드시 <b>구동 상태 검사 기록표</b>에 기록·정리합니다. ' +
  '측정한 데이터를 기록하고 관리하는 것까지가 성취기준입니다.</div>' },

{ unit:'6단원 조립 후 점검', t:'조립 작업의 안전', body:
  '· 규정된 복장을 갖추고 안전 작업을 실시한다.<br>' +
  '· 측정은 반드시 기계가 정지한 후에 실시한다.<br>' +
  '· 작은 나사는 규격에 맞는 공구로 무리한 힘을 가하지 말고 조립한다.<br>' +
  '· 측정기 및 제품에 먼지 및 이물질이 묻지 않도록 주의하고, 조심히 다루고 정리 정돈한다.<br>' +
  '· 조립 작업 전에 작업 전반에 대한 안전 사항을 익히고, 안전 장구를 착용한다.' },

/* ═══════════════════════════════════════════════════════════════
   7~11단원 — 2019~2020학년도 3학년 기계수동조립(메카트로닉스과) 수업 자료
     · 실습 수업 자료 1차시(공압의 특성) · 2차시(유압의 특성)
     · 이론 수업 자료 1차시(공압에너지 생성 시스템) · 2차시(유압에너지 생성 시스템)
     · 이론 수업 자료 3~4차시(공유압 기호) · 4월 5주차 1~2차시(기본 물리량 · 유체 역학)
     · 이론 수업 자료 1~2차시 / 2학기(시퀀스 제어)
   ═══════════════════════════════════════════════════════════════ */

/* ═══ 7단원 · 공압과 유압의 특성 ═══ */
{ unit:'7단원 공압과 유압의 특성', t:'공압의 특성 — 장점과 단점', body:
  '공기를 압축해서 힘을 얻는 것이 <span class="kw">공압</span>입니다. ' +
  '무엇이 좋고 무엇이 나쁜지를 알아야 유압과 갈라 쓸 수 있습니다.' +
  '<table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:10px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'">장점</th><th style="'+TD+'">단점</th></tr>' +
  '<tr><td style="'+TD+';vertical-align:top">' +
    '· 사용 에너지를 쉽게 구할 수 있다<br>· 동력의 전달이 간단하며 먼 거리 이송이 쉽다<br>' +
    '· 에너지로서 저장성이 있다<br>· 힘의 증폭이 용이하고 속도 조절이 간단하다<br>' +
    '· 제어가 간단하고 취급이 용이하다<br>· 폭발과 인화의 위험이 없다<br>' +
    '· 과부하에 대하여 안전하다<br>· 환경 오염의 우려가 없다</td>' +
  '<td style="'+TD+';vertical-align:top">' +
    '· 압축성 에너지이므로 위치 제어성이 나쁘다<br>· 전기나 유압에 비하여 큰 힘을 낼 수 없다<br>' +
    '· 압축성에 의해 응답성이 떨어진다<br>· 배기 소음이 발생한다<br>' +
    '· 균일한 속도를 얻기 힘들다<br>· 초기 에너지 생산 비용이 많이 든다<br>' +
    '· 기밀성 유지를 위해 먼지나 습기가 없는 압축 공기를 만들어야 한다</td></tr></table>' +
  '<div class="warnbox">단점이 거의 다 <b>“공기는 압축된다”</b> 는 한 가지에서 나옵니다. ' +
  '위치 제어성 · 응답성 · 균일한 속도가 모두 여기에 걸립니다.</div>' },

{ unit:'7단원 공압과 유압의 특성', t:'유압의 특성 — 장점과 단점', body:
  '기름을 밀어 힘을 얻는 것이 <span class="kw">유압</span>입니다. 액체는 거의 압축되지 않습니다.' +
  '<table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:10px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'">장점</th><th style="'+TD+'">단점</th></tr>' +
  '<tr><td style="'+TD+';vertical-align:top">' +
    '· 소형 장치로 큰 출력을 얻을 수 있다<br>· 제어가 쉽고 조작이 간편하다<br>' +
    '· 동력 전달 방법 및 기구가 간단하다<br>· 자동 제어가 가능하다<br>· 원격 제어가 가능하다<br>' +
    '· 압력에 대한 출력의 응답이 빠르다<br>· 무단 변속이 가능하다<br>' +
    '· 방청과 윤활이 자동적으로 이루어진다</td>' +
  '<td style="'+TD+';vertical-align:top">' +
    '· 고압에서 누유의 위험이 있다<br>' +
    '· 온도 변화에 따른 점도의 저하가 장치의 작동에 영향을 미쳐 액추에이터의 출력이 변할 수 있다<br>' +
    '· 오일에 기포가 섞여 작동이 불량할 수 있다<br>· 인화의 위험이 있다<br>' +
    '· 전기 회로에 비해 구성 작업이 어렵다<br>· 공기압보다 작동 속도가 떨어진다</td></tr></table>' +
  '<div class="warnbox"><b>폭발·인화</b> 는 공압에서는 장점(위험 없음), 유압에서는 단점(위험 있음)으로 갈립니다. ' +
  '반대로 <b>큰 힘</b> 은 유압이, <b>빠른 작동 속도</b> 는 공압이 앞섭니다.</div>' },

/* ═══ 8단원 · 유체의 기본 물리량과 법칙 ═══ */
{ unit:'8단원 유체의 기본 물리량과 법칙', t:'기본 물리량 다섯 가지', body:
  '<table style="border-collapse:collapse;width:100%;font-size:13.5px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'">이름</th><th style="'+TD+'">무엇인가</th></tr>' +
  '<tr><td style="'+TD+'"><b>밀도</b></td><td style="'+TD+'">단위 체적이 갖는 유체의 질량</td></tr>' +
  '<tr><td style="'+TD+'"><b>압력</b></td><td style="'+TD+'">단위 면적당 작용하는 수직 방향의 힘</td></tr>' +
  '<tr><td style="'+TD+'"><b>비체적</b></td><td style="'+TD+'">단위 중량이 갖는 체적. 단위 질량당의 체적 혹은 밀도의 역수</td></tr>' +
  '<tr><td style="'+TD+'"><b>비중량</b></td><td style="'+TD+'">단위 체적에 유체가 갖는 중량</td></tr>' +
  '<tr><td style="'+TD+'"><b>체적탄성계수</b></td><td style="'+TD+'">유체가 압축되기 어려운 정도</td></tr>' +
  '</table>' +
  '<div class="warnbox"><b>질량</b> 이냐 <b>중량</b> 이냐로 갈립니다. 단위 체적당 — 질량이면 밀도, 중량이면 비중량. ' +
  '비체적은 밀도를 뒤집은 것입니다.</div>' },

{ unit:'8단원 유체의 기본 물리량과 법칙', t:'유체 역학 이론 다섯 가지', body:
  '<b>보일의 법칙</b> — 온도가 일정할 때 공기의 체적은 압력에 <span class="kw">반비례</span>한다.<br>' +
  '<span class="muted">압력이 5배가 되면 체적은 1/5 이 됩니다.</span><br><br>' +
  '<b>샤를의 법칙</b> — 압력이 일정할 때 체적과 온도는 서로 <span class="kw">비례</span>한다.<br><br>' +
  '<b>파스칼의 법칙</b> — 밀폐된 용기 속에 담겨 있는 액체의 안쪽 부분에 주어진 압력은 ' +
  '그 세기에 변함없이 <span class="kw">같은 크기로</span> 액체의 각 부분에 골고루 전달된다.<br>' +
  '<span class="muted">한쪽을 200 kPa 로 누르면 반대쪽에도 200 kPa 이 그대로 전달됩니다. ' +
  '유압으로 작은 힘을 큰 힘으로 바꿀 수 있는 근거입니다.</span><br><br>' +
  '<b>베르누이의 법칙</b> — 압력 손실이 없는 경우 유체의 <span class="kw">위치·속도·압력 수두의 합</span>은 같다.<br><br>' +
  '<b>연속의 법칙</b> — 유체의 밀도가 일정하면 관의 <span class="kw">모든 단면에서의 유량은 일정</span>하다.<br>' +
  '<span class="muted">유량 = 단면적 × 속도. 단면적이 절반으로 줄면 속도는 2배가 됩니다.</span>' +
  '<div class="warnbox"><b>일</b> = 힘 × 거리 · <b>동력</b> = 일 ÷ 시간. 공유압에서 동력은 압력 × 유량으로 계산합니다.</div>' },

/* ═══ 9단원 · 공압 · 유압 에너지 생성 시스템 ═══ */
{ unit:'9단원 에너지 생성 시스템', t:'공압에너지 생성 시스템 — 무엇이 어떤 순서로 붙는가', body:
  '<div style="background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:2">' +

  '필터수동배수기 → 감압밸브(압력게이지) → 윤활기 → 셧오프밸브 → 사용처</div>' +
  '<table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:10px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'">기기</th><th style="'+TD+'">하는 일</th></tr>' +

  '<tr><td style="'+TD+'">애프터쿨러(냉각기)</td><td style="'+TD+'">압축 공기 냉각 / 수분 제거</td></tr>' +
  '<tr><td style="'+TD+'">공기탱크</td><td style="'+TD+'">압축 공기 저장</td></tr>' +
  '<tr><td style="'+TD+'">압력릴리프밸브</td><td style="'+TD+'">시스템 압력 설정용 / 일정 압력 이상 공기 배출</td></tr>' +
  '<tr><td style="'+TD+'">에어드라이어(건조기)</td><td style="'+TD+'">압축 공기 건조 / 수분 제거</td></tr>' +
  '<tr><td style="'+TD+'">필터수동배수기</td><td style="'+TD+'">이물질 제거 및 수동 배출 기능(드레인배출기 부착 필터)</td></tr>' +
  '<tr><td style="'+TD+'">감압밸브</td><td style="'+TD+'">시스템 압력을 감압 / 2차 압력 유지</td></tr>' +
  '<tr><td style="'+TD+'">압력게이지</td><td style="'+TD+'">압력 표시</td></tr>' +
  '<tr><td style="'+TD+'">루브리케이터(윤활기)</td><td style="'+TD+'">공압 기기 윤활 작용 / 윤활유 공급</td></tr>' +
  '<tr><td style="'+TD+'">셧오프밸브(차단밸브)</td><td style="'+TD+'">관로 개폐 밸브 / 공기압 개폐</td></tr>' +
  '<tr><td style="'+TD+'">압력시퀀스밸브</td><td style="'+TD+'">액추에이터를 일정한 순서로 작동시키는 밸브</td></tr>' +
  '</table>' +
  '<div class="warnbox"><b>액추에이터(actuator)</b> — 동력을 이용하여 기계를 동작시키는 구동 장치. ' +
  '어떤 종류의 제어 기구를 갖고 있는 전기 모터 혹은 유압이나 공기압으로 작동하는 피스톤 · 실린더 기구를 가리킨다.</div>' },

{ unit:'9단원 에너지 생성 시스템', t:'유압에너지 생성 시스템 — 무엇이 어떤 순서로 붙는가', body:
  '<div style="background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:2">' +
  '오일탱크(스트레이너 · 에어브리더 · 오일가열기) → <b>유압펌프</b>(전동기가 돌림) → ' +
  '압력릴리프밸브 · 압력게이지 · 압력스위치 · 어큐뮬레이터 → 사용처 → 오일냉각기 → 복귀관 필터 → 오일탱크</div>' +
  '<table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:10px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'">기기</th><th style="'+TD+'">하는 일</th></tr>' +
  '<tr><td style="'+TD+'">유압펌프</td><td style="'+TD+'">유압 작동유 토출 장치</td></tr>' +
  '<tr><td style="'+TD+'">전동기</td><td style="'+TD+'">유압펌프를 작동</td></tr>' +
  '<tr><td style="'+TD+'">압력릴리프밸브</td><td style="'+TD+'">주회로 압력 제어 / 압력 설정</td></tr>' +

  '<div class="warnbox"><b>스트레이너와 복귀관 필터의 차이</b> — 스트레이너는 펌프가 <b>빨아들이기 전(흡입 쪽)</b> 탱크 안에서 ' +

{ unit:'10단원 공유압 기호', t:'기호를 읽는 두 가지 약속', body:
  '<b>① 삼각형의 색</b> — 안이 <span class="kw">까맣게 칠해진 삼각형</span>은 유압(액체), ' +

{ unit:'10단원 공유압 기호', t:'접속 형태', body:

{ unit:'10단원 공유압 기호', t:'에너지원', body:

{ unit:'10단원 공유압 기호', t:'에너지 용기', body:

{ unit:'10단원 공유압 기호', t:'보조 기기 — 계측기와 스위치', body:

{ unit:'10단원 공유압 기호', t:'펌프 · 모터', body:

{ unit:'10단원 공유압 기호', t:'실린더', body:

  '<div class="warnbox"><b>단동</b> 은 공기가 들어가는 구멍(관로)이 <b>하나</b>, <b>복동</b> 은 <b>둘</b>입니다. ' +
  '로드가 한쪽에만 나오면 편로드형, 양쪽으로 나오면 양로드형입니다.</div>' },

{ unit:'10단원 공유압 기호', t:'체크 · 셔틀 · 배기 밸브', body:

{ unit:'10단원 공유압 기호', t:'압력 제어 밸브', body:

  '<tr style="background:#eef1f5"><th style="'+TD+'">밸브</th><th style="'+TD+'">하는 일</th><th style="'+TD+'">파일럿을 받는 곳</th></tr>' +

  '</table>' +
  '<div class="warnbox">이 밖에 <b>언로드밸브 · 카운터밸런스밸브 · 언로드릴리프밸브 · 양방향릴리프밸브 · 브레이크밸브</b>도 ' +
  '압력 제어 밸브에 들어갑니다.</div>' },

{ unit:'10단원 공유압 기호', t:'유체 조정 기구', body:

{ unit:'10단원 공유압 기호', t:'유량 제어 밸브', body:

/* ═══ 11단원 · 시퀀스 제어 ═══ */
{ unit:'11단원 시퀀스 제어', t:'시퀀스 제어란 · 구성 요소', body:
  '<b>시퀀스 제어</b> — 미리 정해 놓은 순서나 일정한 논리에 의하여 정해진 순서에 따라 ' +
  '제어의 각 단계를 차례로 진행하는 제어.<br><br>' +
  '<b>구성 요소</b> — <span class="kw">조작부 · 제어부 · 구동부 · 검출부 · 표시부</span>' +
  '<table style="border-collapse:collapse;width:100%;font-size:13px;margin-top:10px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'">개방회로 제어 시스템</th><th style="'+TD+'">폐회로 제어 시스템</th></tr>' +
  '<tr><td style="'+TD+';vertical-align:top">제어기에 기준 입력으로 가해진 입력 신호에 따라 ' +
    '제어기에서 나온 출력 신호로 제어 대상을 제어<br><br>' +
    '출력이 제어 과정에 영향을 주지 않으며, 구조가 간단하여 유지 보수가 쉽고 가격이 저렴</td>' +
  '<td style="'+TD+';vertical-align:top">개방회로에 <b>되먹임(피드백)</b> 을 추가하여 ' +
    '오차가 발생하면 오차를 제어하는 대상을 제어<br><br>' +
    '제어 시스템 성능 향상 및 원하는 목표값 획득 가능. 제어계가 복잡하며 시스템이 불안정해질 수 있고 제작비가 비쌈</td></tr></table>' +
  '<div class="warnbox">둘을 가르는 것은 오직 하나 — <b>되먹임(피드백)이 있는가</b> 입니다.</div>' },

{ unit:'11단원 시퀀스 제어', t:'스위치 — 유접점 스위치와 검출 스위치', body:
  '<b>유접점 스위치</b><br>' +
  '· <b>푸시버튼 스위치</b> : a접점, b접점, c접점<br>' +
  '· <b>유지형 스위치</b> : 비상 스위치, 셀렉터 스위치<br><br>' +
  '<b>검출 스위치</b><br>' +
  '· <b>접촉형</b> : 마이크로 스위치, 리밋 스위치, 테이프 스위치, 터치 스위치<br>' +
  '· <b>비접촉형</b> :<br>' +
  '&nbsp;&nbsp;&nbsp;— 근접 스위치 (고주파형, 정전 용량형, 자기형, 유도형)<br>' +
  '&nbsp;&nbsp;&nbsp;— 광전 스위치 (투과형, 반사형)<br>' +
  '&nbsp;&nbsp;&nbsp;— 에어리어 감지기 (광전형, 초음파형, 적외선형)' +
  '<div class="warnbox">물체에 <b>닿아야</b> 검출되면 접촉형(리밋 · 마이크로 · 테이프 · 터치), ' +
  '<b>닿지 않아도</b> 검출되면 비접촉형(근접 · 광전 · 에어리어)입니다.</div>' },

{ unit:'11단원 시퀀스 제어', t:'릴레이와 타이머', body:
  '<b>릴레이의 기능</b> — <span class="kw">전달 기능 · 증폭 기능 · 연산 기능 · 변환 기능</span><br><br>' +

    '전원을 가하면 <b>순시에</b> 접점이 닫히거나 열리고, ' +
    '전원을 차단하면 <b>일정 시간이 지나</b> 접점이 열리거나 닫히는 것</td></tr>' +
  '<tr><td style="'+TD+'"><b>한시동작 한시복귀형</b></td><td style="'+TD+'">' +

  '<div class="warnbox">이름을 앞뒤로 끊어 읽습니다. 앞은 <b>전원을 넣을 때</b>, 뒤는 <b>전원을 끊을 때</b>입니다. ' +
  '“한시” 는 시간을 기다린다, “순시” 는 곧바로 라는 뜻입니다.</div>' },

{ unit:'11단원 시퀀스 제어', t:'유접점 제어회로와 무접점 제어회로', body:

  '<b>무접점 시퀀스 제어회로</b> — 제어 회로에 사용되는 소자로 반도체 스위칭 소자를 사용' +
  '<table style="border-collapse:collapse;width:100%;font-size:12.5px;margin-top:10px">' +
  '<tr style="background:#eef1f5"><th style="'+TD+'"></th><th style="'+TD+'">장점</th><th style="'+TD+'">단점</th></tr>' +
  '<tr><td style="'+TD+';vertical-align:top"><b>유접점</b></td>' +
  '<td style="'+TD+';vertical-align:top">· 개폐 부하 용량이 크다<br>· 과부하에 견디는 힘이 크다<br>' +
    '· 전기적 노이즈에 대하여 안정하다<br>· 온도 특성이 양호하다<br>· 입력과 출력을 분리하여 사용할 수 있다</td>' +
  '<td style="'+TD+';vertical-align:top">· 소비 전력이 비교적 크다<br>· 접점이 소모되므로 수명에 한계가 있다<br>' +
    '· 동작 속도가 늦다<br>· 기계적 진동, 충격 등에 비교적 약하다<br>· 외형의 소형화에 한계가 있다</td></tr>' +
  '<tr><td style="'+TD+';vertical-align:top"><b>무접점</b></td>' +
  '<td style="'+TD+';vertical-align:top">· 동작 속도가 빠르다<br>· 고빈도 사용에 견디며 수명이 길다<br>' +
    '· 고정밀도로서 동작 시간 강도에 분산이 적다<br>· 진동 충격에 대한 불량 동작의 우려가 없다<br>' +

function fitCanvas(cv, w, h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);

  return g;
}

  const YC   = 106;               // 본척과 아들자가 만나는 선
  const g = fitCanvas(cv, W, H);

  /* 본척(어미자) 몸통 */
  g.fillStyle = '#e4e9f0'; g.fillRect(X0-38, 40, W-X0+22, YC-40);
  g.strokeStyle = '#c3cad3'; g.lineWidth = 1; g.strokeRect(X0-38.5, 40.5, W-X0+22, YC-40);
  g.fillStyle = '#6b7684'; g.font = 'bold 12px system-ui,sans-serif'; g.textAlign = 'left';
  g.fillText('본척', X0-34, 56);

  /* 본척 눈금 */
  g.strokeStyle = '#2f3a47'; g.textAlign = 'center';
  for(let i=0; i<=MAX; i++){
    const x = Math.round(X0 + i*P) + .5;
    const long = (i%5===0);
    g.lineWidth = long ? 1.6 : 1;
    g.beginPath(); g.moveTo(x, YC); g.lineTo(x, YC - (long?26:13)); g.stroke();
    if(long){ g.fillStyle='#2f3a47'; g.font='bold 13px system-ui,sans-serif'; g.fillText(String(i), x, YC-31); }
  }

  /* 아들자(버니어) — 19mm 를 20등분 → 한 눈금 0.95mm */
  const vx = X0 + value*P;
  g.fillStyle = '#cfd8e3'; g.fillRect(vx-26, YC, 19*P+52, 66);
  g.strokeStyle = '#a8b3c1'; g.strokeRect(vx-26.5, YC+.5, 19*P+52, 66);
  g.fillStyle = '#48525f'; g.font = 'bold 12px system-ui,sans-serif'; g.textAlign='left';
  g.fillText('아들자', vx-22, YC+62);

  g.strokeStyle = '#1c2430'; g.textAlign='center';
  for(let i=0; i<=20; i++){
    const x = Math.round(vx + i*0.95*P) + .5;
    const lab = (i%2===0);
    g.lineWidth = lab ? 1.6 : 1;
    g.beginPath(); g.moveTo(x, YC); g.lineTo(x, YC + (lab?22:13)); g.stroke();
    if(lab){ g.fillStyle='#1c2430'; g.font='bold 12px system-ui,sans-serif'; g.fillText(String((i/2)%10), x, YC+36); }
  }

  /* 두 자가 만나는 선 */
  g.strokeStyle='#8b95a3'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0, YC+.5); g.lineTo(W, YC+.5); g.stroke();

  /* 배우기 예시일 때만 빨간 표시 — 게임에서는 그리지 않습니다 */
  if(showAnswer){
    const k = Math.round((value - Math.floor(value))*20);   // 일치하는 아들자 눈금 번호
    g.strokeStyle = '#e5484d'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(vx+.5, YC-42); g.lineTo(vx+.5, YC+30); g.stroke();
    g.fillStyle='#e5484d'; g.font='bold 12px system-ui,sans-serif'; g.textAlign='center';
    g.fillText('아들자 0', vx, YC-48);
    const ax = vx + k*0.95*P;
    g.beginPath(); g.moveTo(ax+.5, YC-20); g.lineTo(ax+.5, YC+46); g.stroke();
    g.fillText(k+'번 눈금이 일치', ax, YC+60);
  }
}

/* ────────────────────────────────────────────────
   눈금 그림 — 외측 마이크로미터
   피치 0.5mm · 딤블 50등분 → 한 눈금 0.01mm
   ──────────────────────────────────────────────── */
function drawMic(cv, value, showAnswer, px){
  const P   = px || 22;
  const MAX = 25;
  const X0  = 70;
  const W   = X0 + MAX*P + 230, H = 214;
  const YC  = 118;                 // 슬리브 기준선
  const SP  = 11;                  // 딤블 눈금 간격
  const g = fitCanvas(cv, W, H);

  /* 프레임 · 앤빌 · 스핀들 */
  g.fillStyle = '#6d7785'; g.fillRect(14, 68, 16, 100);
  g.fillRect(14, 68, 44, 16); g.fillRect(14, 152, 44, 16);
  g.fillStyle = '#8b95a3'; g.fillRect(52, YC-9, 18, 18);

  /* 슬리브 */
  g.fillStyle = '#e4e9f0'; g.fillRect(X0, 78, MAX*P+18, 80);
  g.strokeStyle = '#c3cad3'; g.lineWidth = 1; g.strokeRect(X0+.5, 78.5, MAX*P+18, 80);

  const edge = X0 + value*P;       // 딤블의 왼쪽 끝 = 스핀들이 나아간 거리

  /* 슬리브 눈금 — 위쪽 줄 1mm, 아래쪽 줄 0.5mm */
  g.textAlign = 'center';
  for(let i=0; i<=MAX*2; i++){
    const mm = i/2, x = Math.round(X0 + mm*P) + .5;
    if(x > edge - 1) break;                       // 딤블에 가려진 부분은 보이지 않습니다
    const whole = (i%2===0);
    g.strokeStyle = '#2f3a47'; g.lineWidth = whole ? 1.6 : 1;
    g.beginPath(); g.moveTo(x, YC); g.lineTo(x, whole ? YC-20 : YC+16); g.stroke();
    if(whole && mm%5===0){ g.fillStyle='#2f3a47'; g.font='bold 13px system-ui,sans-serif'; g.fillText(String(mm), x, YC-26); }
  }
  /* 기준선 */
  g.strokeStyle='#2f3a47'; g.lineWidth=2;
  g.beginPath(); g.moveTo(X0, YC+.5); g.lineTo(Math.min(edge, X0+MAX*P+18), YC+.5); g.stroke();
  g.fillStyle='#6b7684'; g.font='bold 12px system-ui,sans-serif'; g.textAlign='left';
  g.fillText('슬리브', X0+4, 152);   /* 위쪽은 눈금 숫자 자리라 아래에 적습니다 */

  /* 딤블 */
  g.fillStyle = '#c3cad3'; g.fillRect(edge, 62, 200, 112);
  g.strokeStyle = '#9aa4b1'; g.lineWidth = 1; g.strokeRect(edge+.5, 62.5, 200, 112);
  g.fillStyle = '#aab4c1'; g.fillRect(edge+200, 74, 26, 88);
  g.fillStyle='#48525f'; g.font='bold 12px system-ui,sans-serif';
  g.fillText('딤블', edge+8, 78);

  /* 딤블 눈금 — 기준선에 맞은 눈금이 0.01mm 자리 */
  const cur = Math.round(value*100) % 50;
  g.textAlign = 'left';
  for(let d = cur-8; d <= cur+8; d++){
    const y = Math.round(YC + (d-cur)*SP) + .5;
    if(y < 68 || y > 168) continue;
    const dd = ((d%50)+50)%50, five = (dd%5===0);
    g.strokeStyle = '#1c2430'; g.lineWidth = five ? 1.6 : 1;
    g.beginPath(); g.moveTo(edge+12, y); g.lineTo(edge+12+(five?38:24), y); g.stroke();
    if(five){ g.fillStyle='#1c2430'; g.font='bold 12px system-ui,sans-serif';
              g.fillText(String(dd), edge+56, y+4); }
  }

  if(showAnswer){
    g.strokeStyle='#e5484d'; g.lineWidth=2;
    g.beginPath(); g.moveTo(edge+.5, 52); g.lineTo(edge+.5, 184); g.stroke();
    g.fillStyle='#e5484d'; g.font='bold 12px system-ui,sans-serif'; g.textAlign='center';
    g.fillText('딤블 끝', edge, 46);
    g.beginPath(); g.moveTo(edge+8, YC+.5); g.lineTo(edge+120, YC+.5); g.stroke();
    g.textAlign='left'; g.fillText('기준선에 맞은 눈금', edge+124, YC+4);
  }
}

/* ════════════════ 게임 ① 눈금 읽기 ════════════════ */
function makeGaugeRound(kind){
  if(kind==='cal'){
    const mm = ri(1,10), k = ri(0,19), v = mm + k*0.05;
    /* near 는 반드시 섞습니다 — 그래야 본척만 보고는 못 고르고 아들자를 읽어야 합니다 */
    return { kind:'cal', v:Math.round(v*100)/100,
             near:[v+0.05, v-0.05], far:[v+1, v-1, v+0.5, v-0.5] };
  }
  const mm = ri(1,22), half = ri(0,1)*0.5, t = ri(3,47);
  const v = mm + half + t/100;
  /* 0.5mm 자리를 빠뜨리는 것이 가장 흔한 실수라 이것을 반드시 오답으로 넣습니다 */
  return { kind:'mic', v:Math.round(v*100)/100,
           near:[v+0.5, v-0.5], far:[v+0.01, v-0.01, v+0.1, v-0.1] };
}
function gaugeChoices(r){
  const set = [f2(r.v)];
  const push = c => { const s = f2(c);
    if(c > 0.02 && set.indexOf(s) < 0 && set.length < 4) set.push(s); };
  shuffle(r.near.slice()).forEach(push);
  shuffle(r.far.slice()).forEach(push);
  return shuffle(set);
}

function startGauge(v){
  const rounds = [];
  for(let i=0;i<GAUGE_ROUNDS;i++) rounds.push(makeGaugeRound(i%2===0 ? 'cal' : 'mic'));
  quiz = { mode:'gauge', i:0, correct:0, combo:0, best:0, list:rounds, picks:[], zoom:false, startTime:Date.now() };
  drawGauge(v);
}

function drawGauge(v){
  const r = quiz.list[quiz.i], isCal = r.kind==='cal';
  v.innerHTML = '';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));
  const card = el('<div class="card">' +
    '<div class="qnum">'+(quiz.i+1)+' / '+quiz.list.length +
      ' <span class="pill" style="margin-left:6px">'+quiz.correct+'개 맞힘</span>' +
      (quiz.combo>=2 ? ' <span class="combo">🔥 '+quiz.combo+'연속</span>' : '') + '</div>' +
    '<div class="qtext">'+(isCal?'버니어 캘리퍼스':'외측 마이크로미터')+'의 눈금이 가리키는 값은?</div>' +
    '<div class="hintbar">그림이 잘리면 좌우로 밀어 보세요. ' +
      (isCal ? '아들자 0 → mm 자리, 일직선으로 맞은 아들자 눈금 → 0.05mm 자리'
             : '딤블 끝 → 슬리브 눈금(위 1mm · 아래 0.5mm), 기준선에 맞은 딤블 눈금 → 0.01mm 자리') + '</div>' +
    '<div class="scaleBox" id="sbox"></div>' +
    '<div class="row" style="margin:8px 0 12px"><button class="btn" id="zbtn">🔍 확대</button>' +
      '<span class="muted">최소 눈금 '+(isCal?'0.05mm':'0.01mm')+'</span></div>' +
    '<div id="chs"></div><div id="exp"></div></div>');
  v.appendChild(card);

  const paint = ()=>{
    const box = card.querySelector('#sbox'); box.innerHTML='';
    const cv = document.createElement('canvas'); box.appendChild(cv);
    if(isCal) drawCaliper(cv, r.v, false, quiz.zoom?46:30);
    else      drawMic(cv, r.v, false, quiz.zoom?34:22);
  };
  paint();
  card.querySelector('#zbtn').onclick = ()=>{ quiz.zoom = !quiz.zoom; paint();
    card.querySelector('#zbtn').textContent = quiz.zoom ? '🔍 원래대로' : '🔍 확대'; };

  if(!r.ch) r.ch = gaugeChoices(r);
  const chs = card.querySelector('#chs');
  r.ch.forEach((c, idx)=>{
    const b = el('<button class="choice">'+(idx+1)+'. '+c+' mm</button>');
    b.onclick = ()=>pickGauge(v, idx, b, r, card);
    chs.appendChild(b);
  });
}

function pickGauge(v, idx, btn, r, card){
  const ansIdx = r.ch.indexOf(f2(r.v)), ok = idx === ansIdx;
  quiz.picks.push({ kind:r.kind, v:r.v, pick:r.ch[idx], ok });
  if(ok){ quiz.correct++; quiz.combo++; quiz.best = Math.max(quiz.best, quiz.combo); }
  else  { quiz.combo = 0;
          pushWrong({ unit:(r.kind==='cal'?'3단원 측정기':'3단원 측정기'),
                      q:(r.kind==='cal'?'버니어 캘리퍼스':'외측 마이크로미터')+' 눈금 읽기',
                      ch:r.ch, a:ansIdx,
                      ex:(r.kind==='cal'
                          ? 'mm 자리는 아들자 0 이 지나온 본척 눈금, 소수 자리는 본척과 일직선으로 맞은 아들자 눈금 번호 × 0.05mm 입니다.'
                          : '슬리브 아래쪽 줄(0.5mm)이 드러났는지 먼저 확인하세요. 0.5mm 를 빠뜨리는 것이 가장 흔한 실수입니다.') }, idx); }

  card.querySelectorAll('.choice').forEach((b,i)=>{
    b.disabled = true;
    if(i===ansIdx) b.classList.add('correct');
    if(i===idx)    b.classList.add('picked', ok?'correct':'wrong');
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }

  /* 정답 공개 — 이때 비로소 빨간 표시를 그려 줍니다 */
  const box = card.querySelector('#sbox'); box.innerHTML='';
  const cv = document.createElement('canvas'); box.appendChild(cv);
  if(r.kind==='cal') drawCaliper(cv, r.v, true, quiz.zoom?46:30);
  else               drawMic(cv, r.v, true, quiz.zoom?34:22);

  const exp = card.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>'+(ok?'맞았습니다':'정답은 '+f2(r.v)+' mm')+'</b><br>' +
    (r.kind==='cal'
      ? 'mm 자리 '+Math.floor(r.v)+' + 아들자 '+Math.round((r.v-Math.floor(r.v))*20)+'번 × 0.05mm = '+f2(r.v)+' mm'
      : '슬리브 '+f2(Math.floor(r.v*2)/2)+' + 딤블 '+String(Math.round(r.v*100)%50).padStart(2,'0')+' × 0.01mm = '+f2(r.v)+' mm')
    +'</div>'));
  const nx = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
    (quiz.i+1>=quiz.list.length?'결과 보기':'다음 →')+'</button></div>');
  exp.appendChild(nx);
  nx.querySelector('button').onclick = ()=>{
    quiz.i++; quiz.zoom=false;
    if(quiz.i >= quiz.list.length) return finishGame(v, '눈금 읽기',
      quiz.picks.filter(p=>!p.ok).map(p=>(p.kind==='cal'?'캘리퍼스':'마이크로미터')+' '+f2(p.v)+'mm → '+p.pick+'mm 로 읽음'));
    drawGauge(v);
  };
}

/* ════════════════ 게임 ② 공구 고르기 ════════════════ */
function startTool(v){
  const list = shuffle(TOOLQ.slice()).slice(0, 8).map(q=>({ q, ch: shuffle([q.a].concat(q.d)) }));
  quiz = { mode:'tool', i:0, correct:0, combo:0, best:0, list, picks:[], startTime:Date.now() };
  drawTool(v);
}
function drawTool(v){
  const r = quiz.list[quiz.i];
  v.innerHTML = '';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));
  const card = el('<div class="card">' +
    '<div class="qnum">'+(quiz.i+1)+' / '+quiz.list.length +
      ' <span class="pill" style="margin-left:6px">'+quiz.correct+'개 맞힘</span>' +
      (quiz.combo>=2 ? ' <span class="combo">🔥 '+quiz.combo+'연속</span>' : '') + '</div>' +
    '<div class="qtext">'+r.q.q+'<br><span style="font-weight:600;color:#6b7684;font-size:15px">이때 사용할 공구는?</span></div>' +
    '<div class="toolGrid" id="tg"></div><div id="exp"></div></div>');
  v.appendChild(card);
  const tg = card.querySelector('#tg');
  r.ch.forEach(name=>{
    const b = el('<div class="toolCard">'+toolSvg(name)+'<b>'+name+'</b></div>');
    b.onclick = ()=>pickTool(v, name, b, r, card);
    tg.appendChild(b);
  });
}
function pickTool(v, name, btn, r, card){
  const ok = name === r.q.a;
  quiz.picks.push({ q:r.q, pick:name, ok });
  if(ok){ quiz.correct++; quiz.combo++; quiz.best=Math.max(quiz.best,quiz.combo); }
  else  { quiz.combo = 0;
          pushWrong({ unit:'2단원 조립용 수공구', q:r.q.q+' — 사용할 공구는?',
                      ch:r.ch, a:r.ch.indexOf(r.q.a), ex:r.q.ex }, r.ch.indexOf(name)); }
  card.querySelectorAll('.toolCard').forEach(b=>{
    b.onclick = null;
    const n = b.querySelector('b').textContent;
    if(n === r.q.a) b.classList.add('correct');
    if(n === name && !ok) b.classList.add('wrong');
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }
  const exp = card.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>'+(ok?'맞았습니다':'정답은 '+r.q.a)+'</b><br>'+r.q.ex+'</div>'));
  const nx = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
    (quiz.i+1>=quiz.list.length?'결과 보기':'다음 →')+'</button></div>');
  exp.appendChild(nx);
  nx.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finishGame(v, '공구 고르기',
      quiz.picks.filter(p=>!p.ok).map(p=>p.q.a+' 자리에 '+p.pick+' 를 고름'));
    drawTool(v);
  };
}

/* ════════════════ 게임 ③ 조립 순서 ════════════════ */
function startOrder(v){
  const list = shuffle(ORDERQ.slice()).slice(0, 5);
  quiz = { mode:'order', i:0, correct:0, combo:0, best:0, list, picks:[], startTime:Date.now() };
  drawOrder(v);
}
function drawOrder(v){
  const r = quiz.list[quiz.i];
  quiz.placed = []; quiz.miss = 0;
  v.innerHTML = '';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));
  const card = el('<div class="card">' +
    '<div class="qnum">'+(quiz.i+1)+' / '+quiz.list.length +
      ' <span class="pill" style="margin-left:6px">'+quiz.correct+'개 맞힘</span>' +
      (quiz.combo>=2 ? ' <span class="combo">🔥 '+quiz.combo+'연속</span>' : '') + '</div>' +
    '<div class="qtext">'+r.t+'</div>' +
    '<div class="hintbar">먼저 해야 하는 것부터 차례로 누르세요.</div>' +
    '<ul class="slotList" id="slots"></ul>' +
    '<div class="stepPool" id="pool"></div><div id="exp"></div></div>');
  v.appendChild(card);

  const pool = card.querySelector('#pool');
  shuffle(r.steps.map((s,i)=>({s,i}))).forEach(o=>{
    const b = el('<button class="step">'+o.s+'</button>');
    b.dataset.idx = o.i;
    b.onclick = ()=>pickStep(v, o, b, r, card);
    pool.appendChild(b);
  });
}
function pickStep(v, o, btn, r, card){
  const want = quiz.placed.length;
  if(o.i === want){
    quiz.placed.push(o.i);
    btn.classList.add('done'); btn.onclick = null;
    const li = el('<li><span class="slotNo">'+quiz.placed.length+'</span><span>'+o.s+'</span></li>');
    card.querySelector('#slots').appendChild(li);
    try{ if(window.FX) FX.ok(btn); }catch(e){ console.warn('FX', e); }
    if(quiz.placed.length === r.steps.length) return doneOrder(v, r, card);
  } else {
    quiz.miss++;
    btn.classList.add('bad'); setTimeout(()=>btn.classList.remove('bad'), 500);
    try{ if(window.FX) FX.no(btn); }catch(e){ console.warn('FX', e); }
  }
}
function doneOrder(v, r, card){
  const ok = quiz.miss === 0;
  quiz.picks.push({ t:r.t, miss:quiz.miss, ok });
  if(ok){ quiz.correct++; quiz.combo++; quiz.best=Math.max(quiz.best,quiz.combo); }
  else quiz.combo = 0;
  const exp = card.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>' +
    (ok ? '한 번도 틀리지 않고 순서를 맞혔습니다' : '순서를 '+quiz.miss+'번 잘못 짚었습니다') +
    '</b><br>'+r.ex+'</div>'));
  const nx = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
    (quiz.i+1>=quiz.list.length?'결과 보기':'다음 →')+'</button></div>');
  exp.appendChild(nx);
  nx.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finishGame(v, '조립 순서',
      quiz.picks.filter(p=>!p.ok).map(p=>p.t+' — 순서 '+p.miss+'회 틀림'));
    drawOrder(v);
  };
}


/* ════════════════ 게임 ④ 기호 고르기 ════════════════
     한 판에 10라운드. 절반은 기호를 보고 이름을 고르고, 절반은 이름을 보고 기호를 고릅니다.
     ⚠ 오답 보기는 반드시 같은 무리에서만 뽑습니다 — 무리가 다르면 눈으로도 답이 보이기 때문입니다.
     ⚠ 발문·힌트에 정답을 쓰지 않습니다. 채점은 라운드마다 한 번뿐입니다. */
const SYMROUNDS = 10;

function symPool(){
  const out = [];
  Object.keys(SYMGROUP).forEach(g=>{
    SYMGROUP[g].forEach(n=>{ if(SYM[n]) out.push({ n, g }); });
  });
  return out;
}

function makeSymRound(item, dir){
  const mates = SYMGROUP[item.g].filter(x => x !== item.n && SYM[x]);
  let wrong = shuffle(mates).slice(0, 3);
  if(wrong.length < 3){                      /* 무리가 작으면 다른 무리에서 채웁니다 */
    const rest = symPool().filter(x => x.n !== item.n && wrong.indexOf(x.n) < 0)
                          .map(x => x.n);
    wrong = wrong.concat(shuffle(rest).slice(0, 3 - wrong.length));
  }
  return { dir, name:item.n, group:item.g, ch: shuffle([item.n].concat(wrong)) };
}

function startSym(v){
  const pool = shuffle(symPool()).slice(0, SYMROUNDS);
  const list = pool.map((it, i) => makeSymRound(it, i % 2 === 0 ? 'toName' : 'toSym'));
  quiz = { mode:'sym', i:0, correct:0, combo:0, best:0, list, picks:[], startTime:Date.now() };
  drawSym(v);
}

function drawSym(v){
  const r = quiz.list[quiz.i];
  v.innerHTML = '';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));

  const head = '<div class="qnum">'+(quiz.i+1)+' / '+quiz.list.length +
      ' <span class="pill" style="margin-left:6px">'+quiz.correct+'개 맞힘</span>' +
      (quiz.combo>=2 ? ' <span class="combo">🔥 '+quiz.combo+'연속</span>' : '') + '</div>' +
      '<span class="pill">'+r.group+'</span>';

  let card;
  if(r.dir === 'toName'){
    card = el('<div class="card">' + head +
      '<div class="qtext">이 기호가 나타내는 기기의 이름은?</div>' +
      '<div class="symStage">'+SYM[r.name]+'</div>' +
      '<div class="hintbar">같은 무리 안에서 고릅니다. 몸통이 아니라 <b>안에 무엇이 그려져 있는지</b>를 보세요.</div>' +
      '<div id="chs"></div><div id="exp"></div></div>');
    v.appendChild(card);
    const chs = card.querySelector('#chs');
    r.ch.forEach((c,idx)=>{
      const b = el('<button class="choice"><span class="num">'+(idx+1)+'.</span> '+c+'</button>');
      b.onclick = ()=>pickSym(v, card, r, c, b);
      chs.appendChild(b);
    });
  } else {
    card = el('<div class="card">' + head +
      '<div class="qtext"><b>'+r.name+'</b>의 기호로 옳은 것은?</div>' +
      '<div class="hintbar">네 개 모두 같은 무리의 기호입니다. 다른 곳을 찾아 견주어 보세요.</div>' +
      '<div class="symGrid pick" id="sg"></div><div id="exp"></div></div>');
    v.appendChild(card);
    const sg = card.querySelector('#sg');
    r.ch.forEach((c,idx)=>{
      const b = el('<div class="symCell pickable" data-n="'+c+'">' +
        '<span class="symNo">'+(idx+1)+'</span>'+SYM[c]+'</div>');
      b.onclick = ()=>pickSym(v, card, r, c, b);
      sg.appendChild(b);
    });
  }
}

function pickSym(v, card, r, picked, btn){
  const ok = picked === r.name;
  quiz.picks.push({ r, pick:picked, ok });
  if(ok){ quiz.correct++; quiz.combo++; quiz.best = Math.max(quiz.best, quiz.combo); }
  else  { quiz.combo = 0;
          pushWrong({ unit:'10단원 공유압 기호',
                      /* 기호→이름 문제는 발문이 모두 같아 오답노트에서 서로 덮어씁니다.
                         그림을 함께 담아 구분하고, 나중에 다시 볼 때도 기호를 바로 보게 합니다. */
                      q:(r.dir==='toName'
                           ? '이 기호가 나타내는 기기의 이름은? ('+r.group+')' +
                             '<div class="symStage">'+SYM[r.name]+'</div>'
                           : r.name+'의 기호로 옳은 것은? ('+r.group+')'),
                      ch:r.ch, a:r.ch.indexOf(r.name), ex:symWhy(r.name) }, r.ch.indexOf(picked)); }

  if(r.dir === 'toName'){
    card.querySelectorAll('.choice').forEach((b,i)=>{
      b.disabled = true;
      if(r.ch[i] === r.name)   b.classList.add('correct');
      if(r.ch[i] === picked && !ok) b.classList.add('wrong');
    });
  } else {
    card.querySelectorAll('.symCell').forEach(b=>{
      b.onclick = null; b.classList.remove('pickable');
      const n = b.dataset.n;
      if(n === r.name) b.classList.add('correct');
      if(n === picked && !ok) b.classList.add('wrong');
      b.appendChild(el('<b>'+n+'</b>'));      /* 채점이 끝난 뒤에만 이름을 붙입니다 */
    });
  }
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }

  const exp = card.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>'+(ok ? '맞았습니다' : '정답은 '+r.name)+'</b><br>' +
    symWhy(r.name)+'</div>'));
  const nx = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
    (quiz.i+1 >= quiz.list.length ? '결과 보기' : '다음 →')+'</button></div>');
  exp.appendChild(nx);
  nx.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finishGame(v, '기호 고르기',
      quiz.picks.filter(p=>!p.ok).map(p=>p.r.name+' 자리에 '+p.pick+'를 고름'));
    drawSym(v);
  };
}

/* ── 게임 공통 마무리 ── */
function finishGame(v, part, wrongList){
  const n = quiz.list.length;
  const pct = Math.round(quiz.correct / n * 100);
  const sec = Math.round((Date.now() - quiz.startTime)/1000);
  v.innerHTML = '';
  v.appendChild(el('<div class="card" style="text-align:center">' +
    '<div class="score">'+pct+'점</div>' +
    '<div class="muted">'+n+'문제 중 '+quiz.correct+'개 정답 · 최고 연속 '+quiz.best+' · ' +
      Math.floor(sec/60)+'분 '+(sec%60)+'초</div>' +
    '<div id="rankBox" style="margin-top:12px"></div>' +
    '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));
  if(wrongList.length){
    v.appendChild(el('<div class="card"><h3>📕 다시 볼 것</h3><div class="body">· ' +
      wrongList.join('<br>· ')+'</div></div>'));
  }
  mountSubmit(pct, quiz.correct, n, sec, part, wrongList);
  try{
    if(window.FX && pct>=60) FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub: part+' '+pct+'점',
                                         stars: FX.starsFor ? FX.starsFor(pct) : 0 });
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){ const res = Rank.award(pct, { mode:'기계수동조립 — '+part });
                     $('#rankBox').innerHTML = Rank.resultBox(res); }
  }catch(e){ console.warn('Rank', e); }
  const again = el('<div class="card row"><button class="btn" id="ag">↻ 다시 도전</button>' +
    '<button class="btn" id="bk">📖 배우기로</button></div>');
  v.appendChild(again);
  $('#ag').onclick = ()=>render(document.querySelector('.tab.on').dataset.view);
  $('#bk').onclick = ()=>go('learn');
}

/* ════════════════ 연습 · 종합시험 ════════════════ */
function startQuiz(v, mode){
  const n = mode==='exam' ? CFG.examN : CFG.practiceN;
  quiz = { mode, i:0, correct:0, combo:0, best:0, picks:[],
           list: shuffle(QUESTIONS.slice()).slice(0, Math.min(n, QUESTIONS.length)),
           startTime: Date.now() };
  if(!quiz.list.length){ v.appendChild(el('<div class="empty">문항이 아직 없습니다.</div>')); return; }
  drawQ(v);
}
function drawQ(v){
  const q = quiz.list[quiz.i];
  const isExam = quiz.mode==='exam';
  v.innerHTML='';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));
  const card = el('<div class="card">' +
      '<div class="qnum">'+(quiz.i+1)+' / '+quiz.list.length +
        (isExam ? ' <span class="pill" style="margin-left:6px">채점은 마지막에</span>'
                : ' <span class="pill" style="margin-left:6px">'+quiz.correct+'개 맞힘</span>' +
                  (quiz.combo>=2 ? ' <span class="combo">🔥 '+quiz.combo+'연속</span>' : '')) + '</div>' +
      (isExam ? '' : '<span class="pill">'+(q.unit||'')+'</span>') +
      '<div class="qtext">'+q.q+'</div><div id="chs"></div><div id="exp"></div></div>');
  v.appendChild(card);
  const chs = card.querySelector('#chs');
  q.ch.forEach((c,idx)=>{
    const b = el('<button class="choice"><span class="num">'+(idx+1)+'.</span> '+c+'</button>');
    b.onclick = ()=>pick(v, idx, b);
    chs.appendChild(b);
  });
}
function pick(v, idx, btn){
  const q = quiz.list[quiz.i];
  const ok = idx === q.a;
  quiz.picks.push({q, pick:idx, ok});
  if(ok){ quiz.correct++; quiz.combo++; quiz.best=Math.max(quiz.best,quiz.combo); }
  else  { quiz.combo=0; pushWrong(q, idx); }

  if(quiz.mode==='exam'){                 // 종합시험 — 아무 표시 없이 다음으로
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    return drawQ(v);
  }
  document.querySelectorAll('.choice').forEach((b,i)=>{
    b.disabled = true;
    if(i===q.a) b.classList.add('correct');
    if(i===idx) b.classList.add('picked', ok?'correct':'wrong');
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }
  const exp = document.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>'+(ok?'맞았습니다':'정답은 '+(q.a+1)+'번')+'</b><br>'+(q.ex||'')+'</div>'));
  const next = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
      (quiz.i+1>=quiz.list.length?'결과 보기':'다음 문제 →')+'</button></div>');
  exp.appendChild(next);
  next.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    drawQ(v);
  };
}
function pushWrong(q, pick){
  ST.wrong = ST.wrong.filter(w => w.q !== q.q);
  ST.wrong.unshift({ unit:q.unit||'', q:q.q, ch:q.ch, a:q.a, pick, ex:q.ex||'', at:Date.now() });
  ST.wrong = ST.wrong.slice(0, 100);
  save();
}

function finish(v){
  const n   = quiz.list.length;
  const pct = Math.round(quiz.correct / n * 100);
  const sec = Math.round((Date.now() - quiz.startTime)/1000);
  const part = quiz.mode==='exam' ? '종합시험' : '연습';

  v.innerHTML = '';
  v.appendChild(el('<div class="card" style="text-align:center">' +
      '<div class="score">'+pct+'점</div>' +
      '<div class="muted">'+n+'문항 중 '+quiz.correct+'개 정답 · '+Math.floor(sec/60)+'분 '+(sec%60)+'초</div>' +
      '<div id="rankBox" style="margin-top:12px"></div>' +
      '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  const bad = quiz.picks.filter(p=>!p.ok);
  if(bad.length){
    v.appendChild(el('<div class="card"><h3>📕 틀린 문제</h3></div>'));
    bad.forEach(p=>{
      v.appendChild(el('<div class="card">' +
        '<span class="pill">'+(p.q.unit||'')+'</span>' +
        '<div class="qtext">'+p.q.q+'</div>' +
        '<div class="muted">내가 고른 답 : '+(p.pick+1)+'. '+p.q.ch[p.pick]+'</div>' +
        '<div style="color:var(--ok);font-weight:700">정답 : '+(p.q.a+1)+'. '+p.q.ch[p.q.a]+'</div>' +
        '<div class="explain">'+(p.q.ex||'')+'</div></div>'));
    });
  }

  /* 제출을 먼저 붙입니다 — 연출·계급에서 오류가 나도 제출 버튼은 살아 있어야 합니다 */
  mountSubmit(pct, quiz.correct, n, sec, part,
              bad.map(p => (p.q.unit||'')+' '+p.q.q.replace(/<[^>]+>/g,'').slice(0,24)+'… → 정답 '+(p.q.a+1)+'번'));

  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub: part+' '+pct+'점',
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:'기계수동조립 — '+part });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ── 결과 제출 (규약 1) — mode 는 파트마다 다르게 ── */
function mountSubmit(pct, correct, total, sec, part, wrongArr){
  lastResult = {
    mode   : '기계수동조립 — ' + part,
    score  : pct, correct: correct, total: total,
    wrong  : wrongArr || [],
    durationSec : sec,
  };
  const anchor = $('#rSubmitAnchor');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  const btn = ResultCollector.attach(anchor, ()=>lastResult, {
    id:'rcBtn', className:'btn btn-primary',
    mode: lastResult.mode,
    extra: ['기계수동조립 '+part+' '+pct+'점'],
  });
  if(btn){ btn.style.width='100%'; btn.textContent = '📤 ['+part+'] 결과 제출'; }
}

/* ── 오답노트 ── */
function renderWrong(v){
  if(!ST.wrong.length){
    v.appendChild(el('<div class="empty">🗒️ 아직 오답이 없어요!<br>게임이나 시험을 풀면 여기에 모입니다.</div>'));
    return;
  }
  v.appendChild(el('<div class="card row"><b>'+ST.wrong.length+'문항</b>' +
      '<button class="btn" id="clrWrong">비우기</button></div>'));
  $('#clrWrong').onclick = ()=>{ ST.wrong=[]; save(); render('wrong'); };
  ST.wrong.forEach(w=>{
    v.appendChild(el('<div class="card">' +
      '<span class="pill">'+w.unit+'</span>' +
      '<div class="qtext">'+w.q+'</div>' +
      '<div class="muted">내가 고른 답 : '+(w.pick+1)+'. '+w.ch[w.pick]+'</div>' +
      '<div style="color:var(--ok);font-weight:700">정답 : '+(w.a+1)+'. '+w.ch[w.a]+'</div>' +
      '<div class="explain">'+w.ex+'</div></div>'));
  });
}

$('#hdSub').textContent = '개념 ' + LEARN.length + ' · 문항 ' + QUESTIONS.length +
                          ' · 기호 ' + Object.keys(SYM).length +
                          ' · 게임 4종 (눈금 읽기 · 공구 고르기 · 조립 순서 · 기호 고르기)';
render('learn');
</script>
